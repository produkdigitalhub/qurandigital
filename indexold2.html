<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NurIslam - Al-Qur'an, Hadis & Jadwal Shalat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        arabic: ['"Amiri"', 'serif'],
                    },
                    colors: {
                        emerald: {
                            50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981',
                            600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b',
                        },
                        gold: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .active-tab { color: #047857; font-weight: 700; }
        .active-tab i { transform: translateY(-2px); }
    </style>
</head>
<body class="h-full font-sans antialiased text-slate-800 bg-slate-100 flex justify-center items-center sm:py-6">

    <div id="app-container" class="w-full max-w-md h-full sm:h-[90vh] sm:max-h-[850px] bg-slate-50 sm:rounded-[36px] shadow-2xl flex flex-col overflow-hidden relative border-0 sm:border-8 sm:border-slate-800">

        <!-- Dynamic Header -->
        <div id="header-container"></div>

        <!-- Main Content Area -->
        <main id="main-content" class="flex-1 overflow-y-auto p-4 space-y-5 pb-24 hide-scrollbar">

            <!-- VIEW 1: DASHBOARD -->
            <div id="view-dashboard" class="space-y-5">
                <div id="card-next-prayer"></div>
                <div id="card-jurnal"></div>
                <div id="card-quick-menu"></div>
                <div id="card-daily-ayat"></div>
                <div id="card-daily-hadits"></div>
                <div id="card-telegram-feed"></div>
            </div>

            <!-- OTHER VIEWS -->
            <div id="view-quran" class="hidden"></div>
            <div id="view-doa" class="hidden"></div>
            <div id="view-hadits" class="hidden"></div>
            <div id="view-sholat" class="hidden"></div>

        </main>

        <!-- Dynamic Modals Container -->
        <div id="modal-surah-container"></div>
        <div id="modal-tasbih-container"></div>
        <div id="modal-kiblat-container"></div>
        <div id="modal-share-container"></div>
        <div id="modal-telegram-container"></div>

        <!-- Bottom Navigation -->
        <nav class="bg-white/95 backdrop-blur-md border-t border-slate-200/80 px-4 py-2.5 flex justify-between items-center absolute bottom-0 left-0 right-0 z-30 shadow-lg">
            <button id="nav-dashboard" class="nav-item active-tab flex flex-col items-center space-y-1 text-slate-400 transition"><i class="fa-solid fa-house text-lg"></i><span class="text-[10px] font-medium">Beranda</span></button>
            <button id="nav-quran" class="nav-item flex flex-col items-center space-y-1 text-slate-400 transition"><i class="fa-solid fa-book-quran text-lg"></i><span class="text-[10px] font-medium">Al-Qur'an</span></button>
            <button id="nav-float-tasbih" class="w-12 h-12 bg-gradient-to-tr from-emerald-600 to-teal-500 text-white rounded-full flex items-center justify-center text-xl shadow-lg shadow-emerald-600/30 -mt-6 hover:scale-105 active:scale-95 transition"><i class="fa-solid fa-dhikr"></i></button>
            <button id="nav-doa" class="nav-item flex flex-col items-center space-y-1 text-slate-400 transition"><i class="fa-solid fa-hands-praying text-lg"></i><span class="text-[10px] font-medium">Doa</span></button>
            <button id="nav-hadits" class="nav-item flex flex-col items-center space-y-1 text-slate-400 transition"><i class="fa-solid fa-book-open text-lg"></i><span class="text-[10px] font-medium">Hadis</span></button>
        </nav>

        <!-- Toast Floating -->
        <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded-xl text-xs shadow-xl transition-all duration-300 opacity-0 pointer-events-none z-50"></div>

    </div>

    <!-- Scripts Loader -->
    <script type="module" src="js/app.js"></script>
    <script src="js/interactive.js"></script>
</body>
</html>
