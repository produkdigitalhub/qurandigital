<div id="tasbih-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex justify-center items-center p-4">
    <div class="bg-white w-full max-w-xs rounded-3xl p-6 text-center shadow-2xl space-y-5">
        <div class="flex justify-between items-center">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-600 bg-purple-50 px-2.5 py-1 rounded-full">Tasbih Digital</span>
            <button id="btn-close-tasbih-modal" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <div>
            <p class="text-xs text-slate-400 mb-1">Target: 33 Hitungan</p>
            <p id="tasbih-phrase" class="font-arabic text-2xl font-bold text-slate-800">Subhanallah</p>
            <p id="tasbih-latin" class="text-xs text-slate-500 mt-1">Maha Suci Allah</p>
        </div>
        <button id="btn-count-tasbih" class="w-32 h-32 rounded-full bg-gradient-to-tr from-purple-600 to-indigo-600 text-white mx-auto flex flex-col items-center justify-center shadow-lg hover:scale-105 active:scale-95 transition">
            <span id="tasbih-count" class="text-4xl font-extrabold font-mono">0</span>
            <span class="text-[10px] text-purple-200 uppercase tracking-widest mt-1">Ketuk</span>
        </button>
        <div class="flex justify-center space-x-3 pt-2">
            <button id="btn-reset-tasbih" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-semibold transition"><i class="fa-solid fa-rotate-left mr-1"></i> Reset</button>
            <button id="btn-next-tasbih" class="px-3.5 py-1.5 bg-purple-50 hover:bg-purple-100 text-purple-700 rounded-xl text-xs font-semibold transition">Ganti Lafaz <i class="fa-solid fa-arrows-rotate ml-1"></i></button>
        </div>
    </div>
</div>
