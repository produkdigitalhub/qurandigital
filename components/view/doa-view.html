<div id="view-doa" class="hidden space-y-4">
    <div class="flex justify-between items-center px-1">
        <div>
            <h2 class="text-lg font-bold text-slate-800">Kumpulan Doa Harian</h2>
            <p class="text-xs text-slate-500">Doa shahih untuk aktivitas sehari-hari</p>
        </div>
    </div>
    <div class="flex space-x-2 overflow-x-auto pb-1 hide-scrollbar" id="doa-category-chips">
        <button data-cat="semua" class="doa-chip active px-3.5 py-1.5 bg-emerald-600 text-white rounded-full text-xs font-semibold whitespace-nowrap shadow-sm">Semua</button>
        <button data-cat="pagi" class="doa-chip px-3.5 py-1.5 bg-white border border-slate-200 text-slate-600 rounded-full text-xs font-semibold whitespace-nowrap">Pagi & Petang</button>
        <button data-cat="sholat" class="doa-chip px-3.5 py-1.5 bg-white border border-slate-200 text-slate-600 rounded-full text-xs font-semibold whitespace-nowrap">Sholat & Wudhu</button>
        <button data-cat="makan" class="doa-chip px-3.5 py-1.5 bg-white border border-slate-200 text-slate-600 rounded-full text-xs font-semibold whitespace-nowrap">Makan & Minum</button>
        <button data-cat="rumah" class="doa-chip px-3.5 py-1.5 bg-white border border-slate-200 text-slate-600 rounded-full text-xs font-semibold whitespace-nowrap">Rumah & Bepergian</button>
    </div>
    <div id="doa-list-container" class="space-y-3"></div>
</div>
